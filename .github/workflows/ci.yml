name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated tokens match vendored androidx sources
        run: pnpm codegen:check
      # Workspace packages resolve to source via the @kyralabs/source condition, so no build needed.
      - run: pnpm typecheck
      - name: Changed packages have a changeset
        if: github.event_name == 'pull_request'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Every published package emits JS + d.ts
        run: |
          for pkg in m3e-tokens m3e-elements m3e-react m3e-motion m3e-shapes m3e-codegen m3e-icons m3exp-web; do
            test -f "packages/$pkg/dist/index.js"   || { echo "::error::$pkg missing dist/index.js"; exit 1; }
            test -f "packages/$pkg/dist/index.d.ts" || { echo "::error::$pkg missing dist/index.d.ts"; exit 1; }
          done
          test -f packages/m3e-css/dist/index.css
          test -f packages/m3exp-web/dist/css/index.css
      - name: m3e-theme CLI runs under plain Node
        run: node packages/m3e-tokens/dist/cli/theme.js --seed "#6750A4" --variant expressive | grep -q -- "--m3e-sys-color-primary:"
      - name: Packages pack cleanly
        run: pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/*/dist
            apps/docs/dist
          retention-days: 7

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm size

  visual:
    # Pinned Linux image so committed baselines are reproducible (fonts, rasterization).
    # Keep the tag in sync with @playwright/test in apps/visual/package.json.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Playwright (Chromium/Firefox/WebKit × light/dark) + axe
        run: pnpm test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/visual/playwright-report
            apps/visual/test-results
          retention-days: 14
