name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Generated tokens match vendored androidx sources
        run: pnpm codegen:check
      - name: Icon CSS matches the pinned Material Symbols fonts
        run: pnpm icons:check
      # Workspace packages resolve to source via the @kyralabs/source condition, so no build needed.
      - run: pnpm typecheck
      # Skipped on the Release workflow's version PR: it consumes every changeset by design.
      - name: Changed packages have a changeset
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
        run: pnpm changeset status --since=origin/${{ github.base_ref }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Every published package emits JS + d.ts
        run: |
          for pkg in m3e-tokens m3e-elements m3e-react m3e-motion m3e-shapes m3e-codegen m3e-icons m3exp-web; do
            test -f "packages/$pkg/dist/index.js"   || { echo "::error::$pkg missing dist/index.js"; exit 1; }
            test -f "packages/$pkg/dist/index.d.ts" || { echo "::error::$pkg missing dist/index.d.ts"; exit 1; }
          done
          test -f packages/m3e-css/dist/index.css
          test -f packages/m3exp-web/dist/css/index.css
      - name: process.env.NODE_ENV is left for consumer bundlers
        run: node tools/check-node-env.js
      - name: Fonts rebuild byte-identically from the pinned TTF
        run: pnpm fonts:check
      - name: m3e-theme CLI runs under plain Node
        run: node packages/m3e-tokens/dist/cli/theme.js --seed "#6750A4" --variant expressive | grep -q -- "--m3e-sys-color-primary:"
      - name: Packages pack cleanly
        run: pnpm -r --filter "./packages/*" exec pnpm pack --pack-destination "$RUNNER_TEMP/packs"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            packages/*/dist
            apps/docs/dist
          retention-days: 7

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm size
      - name: Font sizes (reported, not failed; REQUIREMENTS §8)
        run: node tools/report-fonts.js

  visual-shard:
    # Pinned Linux image so committed baselines are reproducible (fonts, rasterization).
    # Keep the tag in sync with @playwright/test in apps/visual/package.json.
    # The suite (~65 min on one runner) runs in 6 shards; `visual` below is the one required check.
    name: visual shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Playwright (Chromium/Firefox/WebKit × light/dark) + axe, shard ${{ matrix.shard }}/6
        run: pnpm --filter @kyralabs/visual exec playwright test --shard=${{ matrix.shard }}/6 --reporter=github,blob
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/visual/blob-report
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: apps/visual/test-results
          retention-days: 14

  visual:
    # The required check: green only when every shard passed. It merges the shards' reports into
    # one HTML report.
    if: always()
    needs: visual-shard
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports
        if: always()
        run: pnpm --filter @kyralabs/visual exec playwright merge-reports --reporter html ../../all-blob-reports
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/visual/playwright-report
          retention-days: 14
      - name: Every shard passed
        run: test "${{ needs.visual-shard.result }}" = "success"

  reference:
    # JVM reference fixtures (ROADMAP M3 DoD) regenerate byte-identically from the vendored,
    # unmodified androidx sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Only for `pnpm reference:*`; the harness itself needs no dependencies.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/kotlin-2.4.21
          key: kotlin-2.4.21
      - name: Spring reference (Compose SpringSimulation / SpringEstimation)
        run: pnpm reference:motion
      - name: Shapes reference (graphics-shapes 1.0.1, MaterialShapes, ShapeUtil)
        run: pnpm reference:shapes
      - name: Loading indicator reference (LoadingIndicator.kt geometry)
        run: pnpm reference:loading-indicator
      - name: Carousel reference (Keylines.kt, Strategy.kt, KeylineSnapPosition.kt, carouselItem)
        run: pnpm reference:carousel
      - name: Pull-to-refresh reference (PullToRefresh.kt drag bookkeeping, ArrowValues, drawArrow)
        run: pnpm reference:pull-to-refresh
      - name: Time picker reference (TimePicker.kt state, dial angles / taps / selector, input transformation, scroll indices)
        run: pnpm reference:time-picker
      - name: Date picker reference (calendar model, states, range selection and background, date input validator / transformations)
        run: pnpm reference:date-picker
      - run: git diff --exit-code -- packages/m3e-motion/src/__fixtures__ packages/m3e-shapes/src/__fixtures__
