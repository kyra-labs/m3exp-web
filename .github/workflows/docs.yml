name: Docs

# Builds the docs/playground (apps/docs) and the official site (apps/site, DECISIONS D27) with
# the repo's own toolchain and uploads them to the Cloudflare Pages projects `m3epg` (custom
# domain m3epg.kyralabs.dev) and `m3e-site` (m3e.kyralabs.dev). Cloudflare only serves the static
# files; nothing is built on Cloudflare.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy
  cancel-in-progress: true

env:
  PAGES_PROJECT: m3epg
  SITE_PAGES_PROJECT: m3e-site
  WRANGLER: wrangler@4.151.1

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages first (the docs import their dist), then the Astro site.
      - run: pnpm build
      - name: Create the Pages project on first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes "$WRANGLER" pages project list | grep -qw "$PAGES_PROJECT"; then
            npx --yes "$WRANGLER" pages project create "$PAGES_PROJECT" --production-branch=main
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes "$WRANGLER" pages deploy apps/docs/dist
          --project-name="$PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=true

  deploy-site:
    name: Build and deploy the site to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Packages first (the site imports their dist), then the site and its Pagefind index.
      - run: pnpm build
      - name: Create the Pages project on first run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes "$WRANGLER" pages project list | grep -qw "$SITE_PAGES_PROJECT"; then
            npx --yes "$WRANGLER" pages project create "$SITE_PAGES_PROJECT" --production-branch=main
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes "$WRANGLER" pages deploy apps/site/dist
          --project-name="$SITE_PAGES_PROJECT"
          --branch=main
          --commit-hash="$GITHUB_SHA"
          --commit-dirty=true
