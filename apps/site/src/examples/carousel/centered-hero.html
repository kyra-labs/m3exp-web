<m3e-carousel
  label="Collections"
  layout="centered-hero"
  item-spacing="8"
  style="display: block; inline-size: 100%"
>
  <m3e-carousel-item label="photo camera">
    <div
      style="
        display: grid;
        place-items: center;
        block-size: calc(
          var(--m3e-sys-space-900) + var(--m3e-sys-space-900) + var(--m3e-sys-space-800)
        );
        background-color: var(--m3e-sys-color-surface-container-highest);
      "
    >
      <span class="m3e-icon" aria-hidden="true">photo_camera</span>
    </div>
  </m3e-carousel-item>
  <m3e-carousel-item label="palette">
    <div
      style="
        display: grid;
        place-items: center;
        block-size: calc(
          var(--m3e-sys-space-900) + var(--m3e-sys-space-900) + var(--m3e-sys-space-800)
        );
        background-color: var(--m3e-sys-color-surface-container-highest);
      "
    >
      <span class="m3e-icon" aria-hidden="true">palette</span>
    </div>
  </m3e-carousel-item>
  <m3e-carousel-item label="music note">
    <div
      style="
        display: grid;
        place-items: center;
        block-size: calc(
          var(--m3e-sys-space-900) + var(--m3e-sys-space-900) + var(--m3e-sys-space-800)
        );
        background-color: var(--m3e-sys-color-surface-container-highest);
      "
    >
      <span class="m3e-icon" aria-hidden="true">music_note</span>
    </div>
  </m3e-carousel-item>
  <m3e-carousel-item label="movie">
    <div
      style="
        display: grid;
        place-items: center;
        block-size: calc(
          var(--m3e-sys-space-900) + var(--m3e-sys-space-900) + var(--m3e-sys-space-800)
        );
        background-color: var(--m3e-sys-color-surface-container-highest);
      "
    >
      <span class="m3e-icon" aria-hidden="true">movie</span>
    </div>
  </m3e-carousel-item>
  <m3e-carousel-item label="menu book">
    <div
      style="
        display: grid;
        place-items: center;
        block-size: calc(
          var(--m3e-sys-space-900) + var(--m3e-sys-space-900) + var(--m3e-sys-space-800)
        );
        background-color: var(--m3e-sys-color-surface-container-highest);
      "
    >
      <span class="m3e-icon" aria-hidden="true">menu_book</span>
    </div>
  </m3e-carousel-item>
</m3e-carousel>
