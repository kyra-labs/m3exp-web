<!-- The host is display: contents; a grid stretches the carousel to the height. -->
<div
  style="
    display: grid;
    inline-size: 100%;
    block-size: calc(
      var(--m3e-sys-space-900) + var(--m3e-sys-space-900) + var(--m3e-sys-space-900) +
        var(--m3e-sys-space-900) + var(--m3e-sys-space-800) + var(--m3e-sys-space-800)
    );
  "
>
  <m3e-carousel label="Stories" layout="full-screen">
    <m3e-carousel-item>
      <div
        style="
          display: grid;
          place-items: center;
          align-content: center;
          block-size: 100%;
          background-color: var(--m3e-sys-color-primary-container);
          color: var(--m3e-sys-color-on-primary-container);
        "
      >
        <span class="m3e-icon" aria-hidden="true">landscape</span>
        <span>Mountains</span>
      </div>
    </m3e-carousel-item>
    <m3e-carousel-item>
      <div
        style="
          display: grid;
          place-items: center;
          align-content: center;
          block-size: 100%;
          background-color: var(--m3e-sys-color-secondary-container);
          color: var(--m3e-sys-color-on-secondary-container);
        "
      >
        <span class="m3e-icon" aria-hidden="true">forest</span>
        <span>Forest</span>
      </div>
    </m3e-carousel-item>
    <m3e-carousel-item>
      <div
        style="
          display: grid;
          place-items: center;
          align-content: center;
          block-size: 100%;
          background-color: var(--m3e-sys-color-tertiary-container);
          color: var(--m3e-sys-color-on-tertiary-container);
        "
      >
        <span class="m3e-icon" aria-hidden="true">beach_access</span>
        <span>Beach</span>
      </div>
    </m3e-carousel-item>
    <m3e-carousel-item>
      <div
        style="
          display: grid;
          place-items: center;
          align-content: center;
          block-size: 100%;
          background-color: var(--m3e-sys-color-primary-container);
          color: var(--m3e-sys-color-on-primary-container);
        "
      >
        <span class="m3e-icon" aria-hidden="true">sailing</span>
        <span>Sailing</span>
      </div>
    </m3e-carousel-item>
  </m3e-carousel>
</div>
