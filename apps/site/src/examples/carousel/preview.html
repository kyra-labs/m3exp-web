<div
  class="m3e-carousel m3e-carousel--multi-browse"
  role="region"
  aria-roledescription="carousel"
  aria-label="Trips"
  style="--m3e-comp-carousel-item-width: 120px; inline-size: 100%"
>
  <div class="m3e-carousel__viewport" tabindex="-1">
    <div class="m3e-carousel__item" role="group" aria-roledescription="slide" aria-label="1 of 3">
      <div
        class="m3e-carousel__mask"
        style="
          block-size: var(--m3e-sys-space-900);
          background-color: var(--m3e-sys-color-primary-container);
        "
      ></div>
    </div>
    <div class="m3e-carousel__item" role="group" aria-roledescription="slide" aria-label="2 of 3">
      <div
        class="m3e-carousel__mask"
        style="
          block-size: var(--m3e-sys-space-900);
          background-color: var(--m3e-sys-color-secondary-container);
        "
      ></div>
    </div>
    <div class="m3e-carousel__item" role="group" aria-roledescription="slide" aria-label="3 of 3">
      <div
        class="m3e-carousel__mask"
        style="
          block-size: var(--m3e-sys-space-900);
          background-color: var(--m3e-sys-color-tertiary-container);
        "
      ></div>
    </div>
  </div>
</div>
