<m3e-chip-set label="Trip actions">
  <button type="button" class="m3e-assist-chip">
    <span class="m3e-icon" aria-hidden="true">event</span>
    <span class="m3e-assist-chip__label">Add to calendar</span>
  </button>
  <button type="button" class="m3e-assist-chip m3e-assist-chip--elevated">
    <span class="m3e-icon" aria-hidden="true">directions</span>
    <span class="m3e-assist-chip__label">Directions</span>
  </button>
  <button type="button" class="m3e-assist-chip" disabled>
    <span class="m3e-icon" aria-hidden="true">share</span>
    <span class="m3e-assist-chip__label">Share</span>
  </button>
  <button type="button" class="m3e-suggestion-chip">
    <span class="m3e-suggestion-chip__label">Window seat</span>
  </button>
  <button type="button" class="m3e-suggestion-chip m3e-suggestion-chip--elevated">
    <span class="m3e-icon" aria-hidden="true">lightbulb</span>
    <span class="m3e-suggestion-chip__label">Pack an umbrella</span>
  </button>
</m3e-chip-set>
