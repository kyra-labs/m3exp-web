<m3e-chip-set label="Recipe filters">
  <label class="m3e-filter-chip">
    <input class="m3e-filter-chip__input" type="checkbox" checked />
    <span class="m3e-filter-chip__leading" aria-hidden="true">
      <span class="m3e-icon m3e-filter-chip__check" data-fill>check</span>
    </span>
    <span class="m3e-filter-chip__label">Vegetarian</span>
  </label>
  <label class="m3e-filter-chip">
    <input class="m3e-filter-chip__input" type="checkbox" />
    <span class="m3e-filter-chip__leading" aria-hidden="true">
      <span class="m3e-icon m3e-filter-chip__check" data-fill>check</span>
    </span>
    <span class="m3e-filter-chip__label">Gluten-free</span>
  </label>
  <label class="m3e-filter-chip">
    <input class="m3e-filter-chip__input" type="checkbox" />
    <span class="m3e-filter-chip__leading" aria-hidden="true">
      <span class="m3e-icon m3e-filter-chip__check" data-fill>check</span>
    </span>
    <span class="m3e-filter-chip__label">Spicy</span>
  </label>
  <label class="m3e-filter-chip m3e-filter-chip--elevated">
    <input class="m3e-filter-chip__input" type="checkbox" />
    <span class="m3e-filter-chip__leading" aria-hidden="true">
      <span class="m3e-icon m3e-filter-chip__check" data-fill>check</span>
    </span>
    <span class="m3e-filter-chip__label">Under 30 minutes</span>
  </label>
</m3e-chip-set>
