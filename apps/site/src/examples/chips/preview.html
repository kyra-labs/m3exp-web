<div class="m3e-chip-set" role="group" aria-label="Filters">
  <label class="m3e-filter-chip">
    <input class="m3e-filter-chip__input" type="checkbox" checked />
    <span class="m3e-filter-chip__leading" aria-hidden="true">
      <span class="m3e-icon m3e-filter-chip__check" data-fill>check</span>
    </span>
    <span class="m3e-filter-chip__label">Vegetarian</span>
  </label>
  <button type="button" class="m3e-assist-chip">
    <span class="m3e-icon" aria-hidden="true">event</span>
    <span class="m3e-assist-chip__label">Add to calendar</span>
  </button>
  <button type="button" class="m3e-suggestion-chip">
    <span class="m3e-suggestion-chip__label">Window seat</span>
  </button>
</div>
