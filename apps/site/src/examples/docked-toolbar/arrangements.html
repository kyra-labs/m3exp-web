<div style="display: grid; gap: var(--m3e-sys-space-200); inline-size: 100%">
  <m3e-docked-toolbar label="Actions, spread" arrangement="spread">
    <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Back">
      <span class="m3e-icon" aria-hidden="true">arrow_back</span>
    </button>

      <span class="m3e-icon" aria-hidden="true">share</span>
    </button>
    <button
      type="button"
      class="m3e-icon-button m3e-icon-button--standard"
      aria-label="More options"
    >
      <span class="m3e-icon" aria-hidden="true">more_vert</span>
    </button>
  </m3e-docked-toolbar>
  <m3e-docked-toolbar label="Actions, center" arrangement="center" color-style="vibrant">

  </m3e-docked-toolbar>
  <m3e-docked-toolbar label="Actions, space-around" arrangement="space-around">

      <span class="m3e-icon" aria-hidden="true">arrow_back</span>
