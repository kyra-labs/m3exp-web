<!-- Deprecated (D4): use a docked toolbar. The CSS classes have no roving focus; m3e-react's
     <BottomAppBar> adds it. -->
<div class="m3e-bottom-app-bar" role="toolbar" aria-label="Actions" style="inline-size: 100%">
  <div class="m3e-bottom-app-bar__actions">
    <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Done">
      <span class="m3e-icon" aria-hidden="true">check</span>
    </button>
    <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Edit">
      <span class="m3e-icon" aria-hidden="true">edit</span>
    </button>
    <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Delete">
      <span class="m3e-icon" aria-hidden="true">delete</span>
    </button>
  </div>
  <div class="m3e-bottom-app-bar__fab">
    <button type="button" class="m3e-fab" aria-label="Add">
      <span class="m3e-icon" aria-hidden="true">add</span>
    </button>
  </div>
</div>
