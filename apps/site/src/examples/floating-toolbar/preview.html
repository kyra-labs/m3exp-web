<div
  class="m3e-floating-toolbar m3e-floating-toolbar--with-fab m3e-floating-toolbar--vibrant"
  role="toolbar"
  aria-label="Actions"
>
  <div class="m3e-floating-toolbar__bar">
    <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Bold">
      <span class="m3e-icon" aria-hidden="true">format_bold</span>
    </button>
    <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Italic">
      <span class="m3e-icon" aria-hidden="true">format_italic</span>
    </button>
    <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Underline">
      <span class="m3e-icon" aria-hidden="true">format_underlined</span>
    </button>
  </div>
  <div class="m3e-floating-toolbar__fab">
    <button type="button" class="m3e-fab" aria-label="Add">
      <span class="m3e-icon" aria-hidden="true">add</span>
    </button>
  </div>
</div>
