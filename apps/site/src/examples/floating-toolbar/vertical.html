<m3e-floating-toolbar expanded label="Editing" orientation="vertical">
  <button
    type="button"
    slot="leading"
    class="m3e-icon-button m3e-icon-button--standard"
    aria-label="Done"
  >
    <span class="m3e-icon" aria-hidden="true">check</span>
  </button>
  <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Bold">
    <span class="m3e-icon" aria-hidden="true">format_bold</span>
  </button>
  <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Italic">
    <span class="m3e-icon" aria-hidden="true">format_italic</span>
  </button>
  <button
    type="button"
    slot="trailing"
    class="m3e-icon-button m3e-icon-button--standard"
    aria-label="Favorite"
  >
    <span class="m3e-icon" aria-hidden="true">favorite</span>
  </button>
</m3e-floating-toolbar>
