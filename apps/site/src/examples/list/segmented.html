<m3e-list label="Settings">
  <div class="m3e-list-item m3e-list-item--segmented" data-value="wifi">
    <span class="m3e-list-item__leading"
      ><span class="m3e-icon" aria-hidden="true">wifi</span></span
    >
    <span class="m3e-list-item__content">
      <span class="m3e-list-item__headline">Wi-Fi</span>
      <span class="m3e-list-item__supporting">Home network</span>
    </span>
  </div>
  <div class="m3e-list-item m3e-list-item--segmented" data-value="bluetooth">
    <span class="m3e-list-item__leading"
      ><span class="m3e-icon" aria-hidden="true">bluetooth</span></span
    >
    <span class="m3e-list-item__content">
      <span class="m3e-list-item__headline">Bluetooth</span>
      <span class="m3e-list-item__supporting">Off</span>
    </span>
  </div>
  <div class="m3e-list-item m3e-list-item--segmented" data-value="battery">
    <span class="m3e-list-item__leading"
      ><span class="m3e-icon" aria-hidden="true">battery_full</span></span
    >
    <span class="m3e-list-item__content">
      <span class="m3e-list-item__headline">Battery</span>
      <span class="m3e-list-item__supporting">82%</span>
    </span>
  </div>
</m3e-list>
