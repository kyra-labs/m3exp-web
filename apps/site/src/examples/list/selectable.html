<m3e-list label="Pets" selection-mode="single">
  <div class="m3e-list-item" data-value="cat">
    <span class="m3e-list-item__leading">
      <span class="m3e-radio-button">
        <input class="m3e-radio-button__input" type="radio" />
        <span class="m3e-radio-button__icon" aria-hidden="true"></span>
        <span class="m3e-radio-button__state" aria-hidden="true"></span>
      </span>
    </span>
    <span class="m3e-list-item__content"><span class="m3e-list-item__headline">Cat</span></span>
  </div>
  <div class="m3e-list-item" data-value="dog" aria-selected="true">
    <span class="m3e-list-item__leading">
      <span class="m3e-radio-button">
        <input class="m3e-radio-button__input" type="radio" />
        <span class="m3e-radio-button__icon" aria-hidden="true"></span>
        <span class="m3e-radio-button__state" aria-hidden="true"></span>
      </span>
    </span>
    <span class="m3e-list-item__content"><span class="m3e-list-item__headline">Dog</span></span>
  </div>
  <div class="m3e-list-item" data-value="rabbit">
    <span class="m3e-list-item__leading">
      <span class="m3e-radio-button">
        <input class="m3e-radio-button__input" type="radio" />
        <span class="m3e-radio-button__icon" aria-hidden="true"></span>
        <span class="m3e-radio-button__state" aria-hidden="true"></span>
      </span>
    </span>
    <span class="m3e-list-item__content"><span class="m3e-list-item__headline">Rabbit</span></span>
  </div>
</m3e-list>
