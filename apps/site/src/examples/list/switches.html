<m3e-list label="Connections" selection-mode="multiple">
  <div class="m3e-list-item" data-value="wifi" aria-selected="true">
    <span class="m3e-list-item__leading"
      ><span class="m3e-icon" aria-hidden="true">wifi</span></span
    >
    <span class="m3e-list-item__content">
      <span class="m3e-list-item__headline">Wi-Fi</span>
    </span>
    <span class="m3e-list-item__trailing">
      <span class="m3e-switch">
        <input class="m3e-switch__input" type="checkbox" role="switch" />
        <span class="m3e-switch__track" aria-hidden="true">
          <span class="m3e-switch__handle"><span class="m3e-switch__state"></span></span>
        </span>
      </span>
    </span>
  </div>
  <div class="m3e-list-item" data-value="bluetooth">
    <span class="m3e-list-item__leading"
      ><span class="m3e-icon" aria-hidden="true">bluetooth</span></span
    >
    <span class="m3e-list-item__content">
      <span class="m3e-list-item__headline">Bluetooth</span>
    </span>
    <span class="m3e-list-item__trailing">
      <span class="m3e-switch">
        <input class="m3e-switch__input" type="checkbox" role="switch" />
        <span class="m3e-switch__track" aria-hidden="true">
          <span class="m3e-switch__handle"><span class="m3e-switch__state"></span></span>
        </span>
      </span>
    </span>
  </div>
  <div class="m3e-list-item" data-value="hotspot">
    <span class="m3e-list-item__leading"
      ><span class="m3e-icon" aria-hidden="true">wifi_tethering</span></span
    >
    <span class="m3e-list-item__content">
      <span class="m3e-list-item__headline">Hotspot</span>
      <span class="m3e-list-item__supporting">Share this phone's connection</span>
    </span>
    <span class="m3e-list-item__trailing">
      <span class="m3e-switch">
        <input class="m3e-switch__input" type="checkbox" role="switch" />
        <span class="m3e-switch__track" aria-hidden="true">
          <span class="m3e-switch__handle"><span class="m3e-switch__state"></span></span>
        </span>
      </span>
    </span>
  </div>
</m3e-list>
