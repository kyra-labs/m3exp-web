<button
  type="button"
  id="sort-button"
  class="m3e-icon-button m3e-icon-button--standard"
  aria-label="Sort"
>
  <span class="m3e-icon" aria-hidden="true">sort</span>
</button>
<m3e-menu anchor="sort-button" label="Sort by" variant="vibrant">
  <m3e-menu-item type="radio" value="name" icon="sort_by_alpha">Name</m3e-menu-item>
  <m3e-menu-item type="radio" value="date" icon="schedule" checked>Date modified</m3e-menu-item>
  <m3e-menu-item type="radio" value="size" icon="straighten">Size</m3e-menu-item>
</m3e-menu>
