<div style="display: flex; block-size: var(--m3e-sys-window-height-medium)">
  <m3e-wide-navigation-rail id="rail" label="Main, wide" selected="home">
    <button
      type="button"
      class="m3e-icon-button m3e-icon-button--standard"
      aria-label="Expand navigation"
      aria-expanded="false"
    >
      <span class="m3e-icon" aria-hidden="true">menu</span>
    </button>
    <m3e-navigation-item value="home" icon="home">Home</m3e-navigation-item>
    <m3e-navigation-item value="search" icon="search">Search</m3e-navigation-item>
    <m3e-navigation-item value="mail" icon="mail" badge="3">Mail</m3e-navigation-item>
    <m3e-navigation-item value="settings" icon="settings">Settings</m3e-navigation-item>
  </m3e-wide-navigation-rail>
</div>
<script>
  const rail = document.getElementById('rail');
  const menu = rail.querySelector('button');
  menu.addEventListener('click', () => rail.toggle());
  rail.addEventListener('expanded-change', (event) => {
    if (event.target !== rail) return; // state events bubble in 1.x (D25)
    const { expanded } = event.detail;
    menu.setAttribute('aria-expanded', String(expanded));
    menu.setAttribute('aria-label', expanded ? 'Collapse navigation' : 'Expand navigation');
    menu.querySelector('.m3e-icon').textContent = expanded ? 'menu_open' : 'menu';
  });
</script>
