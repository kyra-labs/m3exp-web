<div
  class="m3e-linear-progress"
  role="progressbar"
  aria-label="Loading"
  aria-valuemin="0"
  aria-valuemax="100"
  aria-valuenow="60"
  style="--m3e-comp-progress-indicator-value: 0.6; inline-size: 60%"
>
  <span class="m3e-linear-progress__track"></span>
  <span class="m3e-linear-progress__indicator"></span>
  <span class="m3e-linear-progress__stop"></span>
</div>
<div
  class="m3e-circular-progress"
  role="progressbar"
  aria-label="Uploading"
  aria-valuemin="0"
  aria-valuemax="100"
  aria-valuenow="40"
  style="--m3e-comp-progress-indicator-value: 0.4"
>
  <svg class="m3e-circular-progress__svg" aria-hidden="true" focusable="false">
    <circle class="m3e-circular-progress__track"></circle>
    <circle class="m3e-circular-progress__indicator"></circle>
  </svg>
</div>
