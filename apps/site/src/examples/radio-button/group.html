<div class="m3e-radio-group" role="radiogroup" aria-label="Notifications">
  <label class="m3e-radio-button">
    <input class="m3e-radio-button__input" type="radio" name="notifications" value="all" />
    <span class="m3e-radio-button__icon" aria-hidden="true"></span>
    <span class="m3e-radio-button__state" aria-hidden="true"></span>
    <span class="m3e-radio-button__label">All notifications</span>
  </label>
  <label class="m3e-radio-button">
    <input
      class="m3e-radio-button__input"
      type="radio"
      name="notifications"
      value="calls"
      checked
    />
    <span class="m3e-radio-button__icon" aria-hidden="true"></span>
    <span class="m3e-radio-button__state" aria-hidden="true"></span>
    <span class="m3e-radio-button__label">Calls only</span>
  </label>
  <label class="m3e-radio-button">
    <input class="m3e-radio-button__input" type="radio" name="notifications" value="none" />
    <span class="m3e-radio-button__icon" aria-hidden="true"></span>
    <span class="m3e-radio-button__state" aria-hidden="true"></span>
    <span class="m3e-radio-button__label">None</span>
  </label>
  <label class="m3e-radio-button">
    <input
      class="m3e-radio-button__input"
      type="radio"
      name="notifications"
      value="custom"
      disabled
    />
    <span class="m3e-radio-button__icon" aria-hidden="true"></span>
    <span class="m3e-radio-button__state" aria-hidden="true"></span>
    <span class="m3e-radio-button__label">Custom (unavailable)</span>
  </label>
</div>
