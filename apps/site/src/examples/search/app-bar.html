<div
  id="trips"
  tabindex="0"
  role="region"
  aria-label="Trips, scrollable"
  style="
    overflow: auto;
    inline-size: 100%;
    max-inline-size: var(--m3e-sys-window-width-medium);
    block-size: var(--m3e-sys-window-height-medium);
  "
>
  <header
    class="m3e-top-app-bar m3e-top-app-bar--search"
    style="position: sticky; inset-block-start: 0; z-index: 1"
  >
    <div class="m3e-top-app-bar__navigation">
      <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Menu">
        <span class="m3e-icon" aria-hidden="true">menu</span>
      </button>
    </div>
    <m3e-search variant="docked-with-gap" label="Search trips" placeholder="Search trips">
      <m3e-search-result icon="history">Hiking trails</m3e-search-result>
      <m3e-search-result icon="history">Kayak rental</m3e-search-result>
      <m3e-search-result icon="history">Mountain huts</m3e-search-result>
    </m3e-search>
    <div class="m3e-top-app-bar__actions">
      <button type="button" class="m3e-icon-button m3e-icon-button--standard" aria-label="Account">
        <span class="m3e-icon" aria-hidden="true">account_circle</span>
      </button>
    </div>
  </header>
  <ul style="margin: 0; padding: var(--m3e-sys-space-200)">
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 1</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 2</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 3</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 4</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 5</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 6</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 7</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 8</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 9</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 10</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 11</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 12</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 13</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 14</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 15</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 16</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 17</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 18</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 19</li>
    <li style="padding-block: var(--m3e-sys-space-150)">Trip 20</li>
  </ul>
</div>
<script type="module">
  import { attachTopAppBarScroll } from '@kyralabs/m3e-elements/top-app-bar.js';

  const scroller = document.getElementById('trips');
  attachTopAppBarScroll(scroller.querySelector('.m3e-top-app-bar'), {
    behavior: 'enter-always',
    target: scroller,
    signal: new AbortController().signal,
  });
</script>
