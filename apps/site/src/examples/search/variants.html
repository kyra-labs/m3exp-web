<script>
  // Filter the suggestions as the query changes: the search renders its result children.
  for (const search of document.querySelectorAll('m3e-search')) {
    const all = [...search.querySelectorAll('m3e-search-result')];
    search.addEventListener('input', (event) => {
      if (!(event.target instanceof HTMLInputElement)) return;
      const query = event.target.value.trim().toLowerCase();
      for (const result of all) result.remove();
      search.append(...all.filter((r) => r.textContent.toLowerCase().includes(query)));
    });
    search.addEventListener('select', (event) => {
      console.log('selected', event.detail.value);
    });
  }
</script>
