<div class="m3e-segmented-button-row" role="group" aria-label="Filters">
  <label class="m3e-segmented-button">
    <input
      class="m3e-segmented-button__input"
      type="checkbox"
      name="filters"
      value="walk"
      checked
    />
    <span class="m3e-segmented-button__icon" aria-hidden="true">
      <span class="m3e-icon m3e-segmented-button__check" data-fill>check</span>
    </span>
    <span class="m3e-segmented-button__label">Walk</span>
  </label>
  <label class="m3e-segmented-button">
    <input
      class="m3e-segmented-button__input"
      type="checkbox"
      name="filters"
      value="bike"
      checked
    />
    <span class="m3e-segmented-button__icon" aria-hidden="true">
      <span class="m3e-icon m3e-segmented-button__check" data-fill>check</span>
    </span>
    <span class="m3e-segmented-button__label">Bike</span>
  </label>
  <label class="m3e-segmented-button">
    <input class="m3e-segmented-button__input" type="checkbox" name="filters" value="transit" />
    <span class="m3e-segmented-button__icon" aria-hidden="true">
      <span class="m3e-icon m3e-segmented-button__check" data-fill>check</span>
    </span>
    <span class="m3e-segmented-button__label">Transit</span>
  </label>
</div>
