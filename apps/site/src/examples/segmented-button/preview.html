<div class="m3e-segmented-button-row" role="radiogroup" aria-label="Range">
  <label class="m3e-segmented-button">
    <input class="m3e-segmented-button__input" type="radio" name="range" value="day" checked />
    <span class="m3e-segmented-button__icon" aria-hidden="true">
      <span class="m3e-icon m3e-segmented-button__check" data-fill>check</span>
    </span>
    <span class="m3e-segmented-button__label">Day</span>
  </label>
  <label class="m3e-segmented-button">
    <input class="m3e-segmented-button__input" type="radio" name="range" value="week" />
    <span class="m3e-segmented-button__icon" aria-hidden="true">
      <span class="m3e-icon m3e-segmented-button__check" data-fill>check</span>
    </span>
    <span class="m3e-segmented-button__label">Week</span>
  </label>
  <label class="m3e-segmented-button">
    <input class="m3e-segmented-button__input" type="radio" name="range" value="month" />
    <span class="m3e-segmented-button__icon" aria-hidden="true">
      <span class="m3e-icon m3e-segmented-button__check" data-fill>check</span>
    </span>
    <span class="m3e-segmented-button__label">Month</span>
  </label>
</div>
