<div
  class="m3e-slider"
  role="group"
  aria-label="Volume"
  style="--m3e-comp-slider-value: 0.4; inline-size: 100%"
>
  <div class="m3e-slider__track">
    <span class="m3e-slider__inactive-start" aria-hidden="true"></span>
    <span class="m3e-slider__active" aria-hidden="true"></span>
    <span class="m3e-slider__inactive-end" aria-hidden="true"></span>
    <div class="m3e-slider__thumb">
      <input
        class="m3e-slider__input"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.4"
        aria-label="Volume"
      />
      <span class="m3e-slider__handle" aria-hidden="true"></span>
    </div>
  </div>
</div>
