<div class="m3e-split-button">

    type="button"
    class="m3e-button m3e-button--filled m3e-button--size-m m3e-split-button__leading"
  >
    <span class="m3e-icon" aria-hidden="true">send</span> Send
  </button>
  <button
    type="button"
    class="m3e-button m3e-button--filled m3e-button--size-m m3e-split-button__trailing"

    aria-haspopup="true"
    aria-expanded="false"

    <span class="m3e-icon" aria-hidden="true">keyboard_arrow_down</span>
  </button>
</div>
