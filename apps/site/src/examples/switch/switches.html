<div style="display: grid; gap: var(--m3e-sys-space-200)">
  <label class="m3e-switch">
    <input class="m3e-switch__input" type="checkbox" role="switch" checked />
    <span class="m3e-switch__track" aria-hidden="true">
      <span class="m3e-switch__handle">
        <span class="m3e-switch__state"></span>
      </span>
    </span>
    <span class="m3e-switch__label">Wi-Fi</span>
  </label>
  <label class="m3e-switch">
    <input class="m3e-switch__input" type="checkbox" role="switch" />
    <span class="m3e-switch__track" aria-hidden="true">
      <span class="m3e-switch__handle">
        <span class="m3e-icon m3e-switch__icon m3e-switch__icon--checked" data-fill>check</span>
        <span class="m3e-icon m3e-switch__icon m3e-switch__icon--unchecked" data-fill>close</span>
        <span class="m3e-switch__state"></span>
      </span>
    </span>
    <span class="m3e-switch__label">Bluetooth</span>
  </label>
  <label class="m3e-switch">
    <span class="m3e-switch__label">Airplane mode</span>
    <input class="m3e-switch__input" type="checkbox" role="switch" checked />
    <span class="m3e-switch__track" aria-hidden="true">
      <span class="m3e-switch__handle">
        <span class="m3e-icon m3e-switch__icon m3e-switch__icon--checked" data-fill>check</span>
        <span class="m3e-switch__state"></span>
      </span>
    </span>
  </label>
  <label class="m3e-switch">
    <input class="m3e-switch__input" type="checkbox" role="switch" disabled />
    <span class="m3e-switch__track" aria-hidden="true">
      <span class="m3e-switch__handle">
        <span class="m3e-switch__state"></span>
      </span>
    </span>
    <span class="m3e-switch__label">Hotspot</span>
  </label>
</div>
