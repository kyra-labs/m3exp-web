<div class="m3e-tabs m3e-tabs--primary" style="inline-size: 100%">
  <div class="m3e-tabs__list" role="tablist" aria-label="Travel">
    <button class="m3e-tab" type="button" role="tab" aria-selected="true">
      <span class="m3e-tab__content">
        <span class="m3e-icon m3e-tab__icon" aria-hidden="true">flight</span>
        <span class="m3e-tab__label">Flights</span>
      </span>
    </button>
    <button class="m3e-tab" type="button" role="tab" aria-selected="false" tabindex="-1">
      <span class="m3e-tab__content">
        <span class="m3e-icon m3e-tab__icon" aria-hidden="true">luggage</span>
        <span class="m3e-tab__label">Trips</span>
      </span>
    </button>
    <button class="m3e-tab" type="button" role="tab" aria-selected="false" tabindex="-1">
      <span class="m3e-tab__content">
        <span class="m3e-icon m3e-tab__icon" aria-hidden="true">explore</span>
        <span class="m3e-tab__label">Explore</span>
      </span>
    </button>
  </div>
</div>
