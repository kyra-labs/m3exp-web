<m3e-time-picker id="alarm" hour="7" minute="30" layout="vertical"></m3e-time-picker>
<p>Alarm: <output id="alarm-value">07:30</output></p>
<script>
  document.getElementById('alarm').addEventListener('change', (event) => {
    const { hour, minute } = event.detail;
    document.getElementById('alarm-value').textContent =
      `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`;
  });
</script>
