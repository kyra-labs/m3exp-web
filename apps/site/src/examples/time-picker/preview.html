<div class="m3e-time-input m3e-time-input--24h">
  <div class="m3e-time-input__fields">
    <div class="m3e-time-input__field" data-selected>
      <input
        class="m3e-time-input__input"
        type="text"
        inputmode="numeric"
        aria-label="Hour"
        value="07"
      />
      <span class="m3e-time-input__supporting" aria-hidden="true">Hour</span>
    </div>
    <span class="m3e-time-input__separator" aria-hidden="true">:</span>
    <div class="m3e-time-input__field">
      <input
        class="m3e-time-input__input"
        type="text"
        inputmode="numeric"
        aria-label="Minute"
        value="30"
      />
      <span class="m3e-time-input__supporting" aria-hidden="true">Minute</span>
    </div>
  </div>
</div>
